{{/*
Pre-create the state Secret so the app only ever needs get/update RBAC on
it (see rbac-state.yaml), never create/delete. `lookup` preserves whatever
is already there across `helm upgrade`, so the persisted lastCommit survives
chart upgrades - only a real `helm uninstall` removes it.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.state.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.state.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "git-monitor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  {{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- end }}
