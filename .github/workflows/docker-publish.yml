name: docker-publish

# Builds and pushes the git-monitor image to Docker Hub
# (azurebrasil/argocd-azdevops-git-monitor).
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME - a Docker Hub username with push access to the repo
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not the account password)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_NAME: azurebrasil/argocd-azdevops-git-monitor

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main branch -> :edge
            type=edge,branch=main
            # v1.2.3 tag -> 1.2.3, 1.2, and (only for tags) latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
