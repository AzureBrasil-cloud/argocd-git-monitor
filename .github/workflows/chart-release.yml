name: chart-release

# Publishes deploy/helm/git-monitor as a classic Helm repository on GitHub
# Pages (https://azurebrasil-cloud.github.io/git-monitor/), the same way
# cert-manager/ingress-nginx/argo-helm publish theirs. Bump Chart.yaml's
# `version` to publish a new chart release - chart-releaser skips versions
# that were already published.
#
# One-time repo setup (not done by this workflow):
#   1. Settings -> Actions -> General -> Workflow permissions -> set to
#      "Read and write permissions" (chart-releaser needs to push the
#      gh-pages branch and create GitHub Releases using GITHUB_TOKEN).
#   2. After this workflow runs once and creates the gh-pages branch:
#      Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/git-monitor/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
